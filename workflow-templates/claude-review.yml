name: Claude PR Review
on:
  issue_comment:
    types: [created]
  pull_request_target: # warms the browser cache in main scope
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      command:
        description: 'Passes to run, e.g. "/review code functional". Empty = judges only.'
        required: false
        type: string

concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # Filter only — without it every comment on every issue opens a run that
    # exists just to skip itself. Authorization lives in the called workflow.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review'))
    uses: panenco/claude-review/.github/workflows/pr-review.yml@v3
    # Required in full — reusable-workflow permissions are capped by the
    # caller's. Omitting any of these gives a startup_failure with no logs.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      command: ${{ inputs.command || '' }}
    secrets: inherit
